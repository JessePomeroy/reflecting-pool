name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Audit H34: cancel in-progress runs for the same ref when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@jessepomeroy"
          token: ""

      - name: Enable reviewed pnpm
        run: |
          corepack enable
          corepack pnpm --version | grep -Fx '10.34.5'

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # Audit M14: match the local `pnpm lint` command (biome check .) so CI
      # and local linting agree on scope. Previously CI scanned only src/,
      # which meant scripts/ and convex/ lint errors slipped through.
      - name: Lint
        run: pnpm lint

      - name: Type check
        env:
          STRIPE_SECRET_KEY: placeholder
          STRIPE_WEBHOOK_SECRET: placeholder
          RESEND_API_KEY: placeholder
          SANITY_API_TOKEN: placeholder
          SANITY_DATASET: production
          SANITY_PROJECT_ID: placeholder
          LUMAPRINTS_API_KEY: placeholder
          LUMAPRINTS_API_SECRET: placeholder
          LUMAPRINTS_STORE_ID: placeholder
          LUMAPRINTS_USE_SANDBOX: "true"
          PUBLIC_SITE_URL: https://placeholder.com
          PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          GALLERY_WORKER_URL: placeholder
          GALLERY_ADMIN_SECRET: placeholder
        run: pnpm check

      # Audit H33: run the full vitest suite on every PR / push so regressions
      # in webhook math, pricing, LumaPrints encoder, or coupon math land in
      # the status check, not in production.
      - name: Tests
        run: pnpm test

      - name: Install Playwright browser
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        env:
          PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
        run: pnpm test:browser
